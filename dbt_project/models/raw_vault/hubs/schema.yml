version: 2
models:
- name: HUB_DEPARTMENT
  description: Raw Vault Hub sourced directly from BRONZE.DEPARTMENT; grain is one row per distinct approved
    business key (DEPARTMENT_ID).
  config:
    materialized: incremental
    alias: HUB_DEPARTMENT
    unique_key: HUB_HK
    incremental_strategy: append
    on_schema_change: fail
    table_format: iceberg
    catalog: SNOWFLAKE
    external_volume: SNOWFLAKE_MANAGED
    tags:
    - yaml_phase_2
    - data_vault_hub
    contract:
      enforced: true
  columns:
  - name: HUB_HK
    description: Deterministic SHA-256 Hub hash key derived from DEPARTMENT_ID; identifies one durable
      business entity and is referenced by Links and Satellites.
    data_type: VARCHAR
    quote: false
    data_tests:
    - not_null
    - unique
  - name: DEPARTMENT_ID
    description: Approved business-key value for this model. Business identifier of the department.
    data_type: NUMBER(38,0)
    quote: false
    data_tests:
    - not_null
  - name: LDTS
    description: Technical load timestamp for the Bronze record, used to order incremental loads and preserve
      Data Vault history.
    data_type: TIMESTAMP_NTZ
    quote: false
    data_tests:
    - not_null
  - name: RSRC
    description: Record-source identifier naming the approved Bronze relation from which the Data Vault
      row was derived.
    data_type: VARCHAR
    quote: false
