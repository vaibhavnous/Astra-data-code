version: 2
models:
- name: LINK_EMPLOYEE_DEPARTMENT
  description: Raw Vault Link sourced directly from BRONZE.DEPARTMENT; grain is one relationship per LINK_HK
    connecting HUB_EMPLOYEE and HUB_DEPARTMENT using the approved relationship BRONZE.DEPARTMENT->BRONZE.EMPLOYEE.
  config:
    materialized: incremental
    alias: LINK_EMPLOYEE_DEPARTMENT
    unique_key: LINK_HK
    incremental_strategy: append
    on_schema_change: fail
    table_format: iceberg
    catalog: SNOWFLAKE
    external_volume: SNOWFLAKE_MANAGED
    tags:
    - yaml_phase_2
    - data_vault_link
    contract:
      enforced: true
  columns:
  - name: LINK_HK
    description: Deterministic SHA-256 Link hash key derived from the connected Hub hash keys; identifies
      one governed relationship instance.
    data_type: VARCHAR
    quote: false
    data_tests:
    - not_null
    - unique
  - name: DEPARTMENT_HUB_HK
    description: Deterministic Hub hash key referencing the Department Hub participating in this relationship.
    data_type: VARCHAR
    quote: false
    data_tests:
    - not_null
    - relationships:
        to: '{{ ref(''HUB_DEPARTMENT'') }}'
        field: HUB_HK
  - name: EMPLOYEE_HUB_HK
    description: Deterministic Hub hash key referencing the Employee Hub participating in this relationship.
    data_type: VARCHAR
    quote: false
    data_tests:
    - not_null
    - relationships:
        to: '{{ ref(''HUB_EMPLOYEE'') }}'
        field: HUB_HK
  - name: LDTS
    description: Technical load timestamp for the Bronze record, used to order incremental loads and preserve
      Data Vault history.
    data_type: TIMESTAMP_NTZ
    quote: false
    data_tests:
    - not_null
  - name: RSRC
    description: Record-source identifier naming the approved Bronze relation from which the Data Vault
      row was derived.
    data_type: VARCHAR
    quote: false
