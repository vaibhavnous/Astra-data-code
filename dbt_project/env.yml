env_config:
  default_environment: workspace
  environments:
  - name: workspace
    env:
      DBT_ATHENA_DV_LOAD_TIMESTAMP: '{{ select TO_VARCHAR(CURRENT_TIMESTAMP(), ''YYYY-MM-DD
        HH24:MI:SS.FF6'') }}'
      DBT_SNOWFLAKE_ROLE: ACCOUNTADMIN
      DBT_SNOWFLAKE_WAREHOUSE: COMPUTE_WH
      DBT_SNOWFLAKE_PROJECT_DATABASE: INSURANCE
      DBT_SNOWFLAKE_PROJECT_SCHEMA: DBT_PROJECT
      DBT_SNOWFLAKE_BRONZE_DATABASE: INSURANCE
      DBT_SNOWFLAKE_BRONZE_SCHEMA: BRONZE
      DBT_SNOWFLAKE_SILVER_DATABASE: INSURANCE
      DBT_SNOWFLAKE_SILVER_SCHEMA: SILVER
      DBT_SNOWFLAKE_GOLD_DATABASE: INSURANCE
      DBT_SNOWFLAKE_GOLD_SCHEMA: GOLD
